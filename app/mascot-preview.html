<!doctype html>
<!-- Dev-only: all 8 mascot states side by side. Served by the Vite dev server at
     /mascot-preview.html. Not part of the production build (Vite only builds
     index.html unless rollupOptions.input says otherwise). -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Niva mascot preview</title>
    <style>
      body { margin: 0; background: #0d0f18; color: #dfe3f5; font-family: "Segoe UI", system-ui, sans-serif; }
      header { display: flex; gap: 24px; align-items: center; padding: 14px 20px; border-bottom: 1px solid #23273a; }
      h1 { font-size: 16px; margin: 0; font-weight: 600; }
      label { font-size: 14px; cursor: pointer; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(450px, 1fr)); gap: 16px; padding: 20px; }
      .cell { background: #141726; border: 1px solid #23273a; border-radius: 12px; padding: 12px; }
      .cell h2 { margin: 0 0 8px; font-size: 13px; letter-spacing: 0.4px; color: #9aa3cf; font-weight: 600; }
      .row { display: flex; align-items: flex-end; gap: 14px; }
      .scale { font-size: 11px; color: #6c7396; margin-top: 4px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/mascot/preview.tsx"></script>
  </body>
</html>
