[package]
name = "niva"
version = "0.1.0"
description = "Niva desktop app"
edition = "2024"
default-run = "niva"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "niva_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
# `preserve_order`: the key order of the tool schemas is part of the prompt the
# model sees (Ollama renders them into the chat template), so it must be the
# order E1 measured, not alphabetical.
serde_json = { version = "1", features = ["preserve_order"] }
niva-core = { path = "../../crates/niva-core" }
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
# Blocking HTTP client (no async stack). The local Ollama adapter speaks plain
# HTTP to 127.0.0.1; the Tavily search adapter needs HTTPS, through the
# operating system's TLS (Schannel) and trust store (`native-tls-no-default`:
# no bundled root list, no rustls/ring C build).
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }
# `niva-eval` only (feature `eval`): reads eval/commands.yaml.
serde_norway = { version = "0.9", optional = true }
# Task 3.4, `adapters/audio_cue.rs`: the chime and the listening cue, played by the
# host so they work with the sidecar down. `playback` only: the cues are
# generated sine tones, so no file decoder (flac, mp3, vorbis, wav) is needed.
rodio = { version = "0.23", default-features = false, features = ["playback"] }

[target.'cfg(windows)'.dependencies]
# GetLocalTime, for the local time the system prompt states; GetLastInputInfo
# (feature Win32_UI_Input_KeyboardAndMouse), for the sleep countdown: the time of
# the last input, never a keyboard hook. PR 2d-a (win_apps): the process list
# (ToolHelp, ProcessIdToSessionId, GetCurrentProcessId), ShellExecuteExW to start
# an indexed app (its struct needs Win32_System_Registry), and COM initialisation for the worker threads that call it.
# PR 2d-b: Win32_System_Power (CallNtPowerInformation, the Modern Standby flag),
# Win32_System_Shutdown (LockWorkStation, ExitWindowsEx) and Win32_Security (the
# SeShutdownPrivilege token adjustment) and Win32_Storage_Packaging_Appx
# (GetApplicationUserModelId, to match a UWP frame to its process); PostMessageW and EnumWindows come from
# Win32_UI_WindowsAndMessaging, already on.
# Task 3.4: Win32_System_JobObjects, a job with KILL_ON_JOB_CLOSE around the voice
# sidecar so it cannot outlive the app and keep the microphone.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# win_volume: the Core Audio endpoint API is COM, which windows-sys exposes only
# as raw vtables. The crate is already in the lock for Tauri (same 0.62.2); only
# the features below are turned on for the audio endpoint volume and, in win_close,
# the window property store (the AppUserModelID of a UWP frame).
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell_PropertiesSystem",
] }

[features]
# The E1 eval runner. Off in every app build: it turns on the fakes of
# `niva-core` (`testing`) and the YAML reader, neither of which may ship.
eval = ["dep:serde_norway", "niva-core/testing"]

[[bin]]
name = "niva-eval"
path = "src/bin/niva-eval.rs"
required-features = ["eval"]

[dev-dependencies]
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "test-util"] }

