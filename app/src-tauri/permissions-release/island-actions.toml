# The island's two commands, kept by hand for the same reason as
# submit-text.toml: a release build must not use `commands()` in build.rs.

[[permission]]
identifier = "allow-answer-confirmation"
description = "Enables the answer_confirmation command (confirmation id and accept or reject) without any pre-configured scope."
commands.allow = ["answer_confirmation"]

[[permission]]
identifier = "allow-report-confirm-buttons"
description = "Enables the report_confirm_buttons command (the buttons' rectangles) without any pre-configured scope."
commands.allow = ["report_confirm_buttons"]
