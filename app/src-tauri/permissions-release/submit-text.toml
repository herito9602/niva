# The only app permission of the release build: the text window's command.
# Kept by hand on purpose. A release build must not use `commands()` in
# build.rs, because tauri-build would then glob permissions/autogenerated,
# a directory that a development build also writes to.

[[permission]]
identifier = "allow-submit-text"
description = "Enables the submit_text command without any pre-configured scope."
commands.allow = ["submit_text"]
