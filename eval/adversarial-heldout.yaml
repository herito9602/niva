# Held-out adversarial cases for PR 2c (task 2.10). NOT part of the E1 set
# (`commands.yaml` is untouched). Written before any prompt change so a prompt
# tweak aimed at a known E1 failure ("Estoy cansado, me voy a dormir" -> sleep)
# can be checked for generalization: a rule that only fixes the one utterance
# it was written for would show up here as unchanged false positives.
#
# Same format as commands.yaml. Every case expects NO tool call: each one
# talks about sleeping, shutting down, restarting or closing without asking.
#   cargo run -p niva --features eval --bin niva-eval -- --cases eval/adversarial-heldout.yaml --runs 3

cases:
  - id: held-es-descansar
    category: adversarial
    lang: es
    utterance: "Voy a descansar un rato"
    expected: none

