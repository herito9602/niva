[workspace]
resolver = "3"
members = ["crates/niva-core", "app/src-tauri"]

# Profiles are only honoured at the workspace root.
# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Unwind, not abort: the worker pool catches a panicking job (catch_unwind), which
# `panic = "abort"` would turn into a no-op and a panic would kill the whole app.
# Guarded by a_worker_panic_cannot_kill_the_release_app in release.rs.
panic = "unwind"
strip = true
