schema: spec-driven

context: |
  Project: niva. Jarvis-style personal voice assistant for Windows 11 with an animated floating "island" UI.
  Target user v1: the owner plus a few friends (no accounts, payments or licensing). Git repo github.com/herito9602/niva, chained PRs stacked to `main`; slice 1 done.
  Stack validated by spikes (throwaway, under spikes/): Tauri 2 (Rust) + React + TypeScript + Vite desktop app;
  Python 3.12 via `uv run` for voice/LLM spikes; Ollama local LLM (qwen3.5:4b-q4_K_M, chosen by E1) behind a provider port; openWakeWord.
  Decisions live in openspec/changes/niva-mvp/design.md (D1-D10); open items in docs/BACKLOG.md.
  Env rule: run Rust/cargo from PowerShell, never Git Bash (Git's `link` shadows MSVC link.exe).
  Artifacts are written in English.

strict_tdd: true

testing:
  strict_tdd: true
  reason: "Test runners exist since slice 1.A (tasks 1.4, 1.5); reducer work is test-first from task 1.6. Spikes have no tests."
  runner:
    command: "cargo test -p niva-core (Rust core, run from PowerShell); npm test in app/ (vitest)"
    framework: "cargo test (Rust), vitest (TypeScript)"
  layers:
    unit: true
    integration: false
    e2e: false
  coverage:
    available: false
    command: null
  quality:
    linter: false
    type_checker: "tsc (available only inside spikes/island via TypeScript devDependency; not a product setup)"
    formatter: false
  candidates:
    - "Rust: cargo test (built-in)"
    - "TypeScript: vitest"
    - "Python: pytest"

rules:
  proposal:
    - Reference BACKLOG.md items and spike findings when scoping.
    - Keep the first slice small; list non-goals explicitly.
  specs:
    - Use Given/When/Then scenarios with RFC 2119 keywords.
  design:
    - Keep the LLM behind a swappable provider port (hexagonal).
    - Risky tool actions require confirmation enforced in code, not in the prompt.
  tasks:
    - "Plan PRs for reviewability, not a line budget (owner decision 2026-11-03; replaces the 400-line budget, which every slice-1 PR exceeded):"
    - Safety-critical code (action safety, Approved<T>, protected list, matchers, capabilities) goes in its own PR, never mixed with bulk code or prose.
    - One PR = one concern; each PR from slice 2 on ends in something the owner can try by hand.
    - Test lines do not count toward PR size; report production and test lines separately.
  apply:
    - Run cargo only from PowerShell.
    - Strict TDD: write the failing test first (reducer work from task 1.6 on). Runners: cargo test -p niva-core (PowerShell), npm test in app/.
  verify:
    - Verify with the test runners plus manual scenario checks for UI, voice and Windows adapters (E2E stays manual).
  archive:
    - Merge delta specs into openspec/specs before archiving.
